<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SearchStax Smart Answers Standalone</title>

  <link rel="stylesheet" href="https://static.searchstax.com/studio-js/v4.2.10/css/search-ux.css" />

  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .search-row { display: flex; gap: 8px; margin-bottom: 24px; }
    #custom-query-input { flex: 1; padding: 10px; font-size: 16px; }
    #custom-search-button { padding: 10px 16px; cursor: pointer; }
    #feedbackWidgetContainer {
      margin-top: 20px;
    }

    .searchstax-lightweight-widget-container {
      display: flex;
    }
    .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-up {
      cursor: pointer;
    }
    .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-up svg {
      stroke: #969696;
    }
    .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-up:hover svg, .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-up.active svg {
      stroke: #333333;
    }
    .searchstax-lightweight-widget-container .searchstax-lightweight-widget-separator {
      margin: 0 5px;
      width: 1px;
      height: 17px;
      background-color: #dcdcdc;
    }
    .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-down {
      cursor: pointer;
    }
    .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-down svg {
      stroke: #969696;
    }
    .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-down:hover svg, .searchstax-lightweight-widget-container .searchstax-lightweight-widget-thumbs-down.active svg {
      stroke: #333333;
    }
  </style>
</head>

<body>
  <h1>Smart Answers Widget in Custom UI</h1>

  <div class="container">
    <div class="searchstax-page-layout-container">
        <div id="searchstax-input-container">
        <input id="custom-query-input" style="width:80%"></input>
        <button id="custom-search-button">Search</button>
        </div>
        <div id="searchstax-answer-container"></div>
    </div>
  </div>
  <script src="https://static.searchstax.com/studio-js/v4.2.10/js/search-ux.js"></script>

  <script>
    function makeId(length) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let result = "";
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    const Searchstax = window["@searchstaxInc/searchstudioUxJs"].Searchstax;
    const searchstax = new Searchstax();

    searchstax.initialize({
      searchURL: "",
      suggesterURL: "",
      language: "en",

      // Replace with client-specific values
      questionURL: "https://search-ai-us.searchstax.com/api/v1/1442/answer/",
      searchAuth: "b065448ad1484e205f4851f0ce89d128e704e2f4",
      authType: "token",

      analyticsBaseUrl: "https://analytics-us.searchstax.com",
      trackApiKey: "DPAOKNB9c5chZZDwN1Il9dLUCLMGF1ggehy0dWewZwk",

      model: "Main Profile",
      sessionId: makeId(25)
    });

    searchstax.addAnswerWidget("searchstax-answer-container", {
      templates: {
        main: {
          template: ``
        }
      },
      feedbackwidget: {
        renderFeedbackWidget: true,
        thumbsUpValue: 10,
        thumbsDownValue: 0
      }
    });

    function triggerSearchStaxReload(query) {
      searchstax.dataLayer.setSearchObject({
        ...searchstax.dataLayer.searchObject,
        query: query,
        page: 1
      });
    }

    document.getElementById("custom-search-button").addEventListener("click", function () {
      const query = document.getElementById("custom-query-input").value;
      triggerSearchStaxReload(query);
    });

    document.getElementById("custom-query-input").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        triggerSearchStaxReload(event.target.value);
      }
    });
  </script>
</body>
</html>
